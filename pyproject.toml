[tool.ruff]
target-version = "py312"
line-length = 100
src = ["task3-dcyn", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  # Insecure demo fixture intentionally contains a fake secret string.
  "S105",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
